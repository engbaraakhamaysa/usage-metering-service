name: Client checks

on:
  pull_request_target:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read
  pull-requests: read

jobs:
  client-scope:
    name: Client scope
    runs-on: ubuntu-latest

    steps:
      - name: Check changed file paths
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            // This restriction applies to the client branch.
            if (pr.head.ref !== "client") {
              core.notice("Client scope restriction does not apply to this branch.");
              return;
            }

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                per_page: 100,
              }
            );

            // Fail if GitHub did not return the complete file list.
            if (files.length !== pr.changed_files) {
              core.setFailed("Could not verify all changed files.");
              return;
            }

            const forbidden = files.filter((file) => {
              const currentOutside = !file.filename.startsWith("client/");
              const previousOutside =
                file.previous_filename &&
                !file.previous_filename.startsWith("client/");

              return currentOutside || previousOutside;
            });

            if (forbidden.length > 0) {
              for (const file of forbidden) {
                core.error(`Outside client/: ${file.filename}`);
              }

              core.setFailed(
                "Pull requests from client may only change files inside client/."
              );
              return;
            }

            core.notice("All changed files are inside client/.");
